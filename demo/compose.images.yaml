name: clinical-trial-matcher-images
services:
  trial-index:
    image: clinical-trial-index:ctgov-20261117T100005-recruiting-572058e0a049
    build:
      context: ..
      dockerfile: demo/index-image/Dockerfile
      args:
        INDEX_PATH: data/current/ctgov-20261117T100005/bm25.sqlite
        INDEX_MANIFEST_PATH: data/manifests/ctgov-current.json
    environment:
      EXPECTED_INDEX_SHA256: 572058e0a049e8db07650515ace70bd80912b4350c2e2fcea602527ce7670f71
    volumes:
      - type: volume
        source: trial-index
        target: /data
        volume:
          nocopy: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: none
    restart: "no"
  matcher:
    image: clinical-trial-matcher:local
    build:
      context: .
    depends_on:
      trial-index:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      TRIAL_INDEX_PATH: /data/bm25.sqlite
      TRIAL_PIPELINE: fusion
      DEMO_USERNAME: ${DEMO_USERNAME:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      REQUIRE_AUTH: ${REQUIRE_AUTH:-false}
      MAX_SEARCHES_PER_MINUTE: 10
    volumes:
      - type: volume
        source: trial-index
        target: /data
        read_only: true
        volume:
          nocopy: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.5
    mem_limit: 1g
    init: true
    stop_grace_period: 60s
    restart: unless-stopped
volumes:
  trial-index:
    name: clinical-trial-index-ctgov-20261117T100005-recruiting-572058e0a049
